<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }
    
        html {
            scroll-behavior: smooth;
        }
    
        body {
            min-height: 100vh;
    
            background:
                radial-gradient(circle at 10% 20%,
                    rgba(59, 130, 246, 0.17),
                    transparent 28%),
                radial-gradient(circle at 90% 20%,
                    rgba(139, 92, 246, 0.14),
                    transparent 30%),
                radial-gradient(circle at 80% 90%,
                    rgba(6, 182, 212, 0.11),
                    transparent 28%),
                linear-gradient(135deg,
                    #f8fbff 0%,
                    #eef4ff 50%,
                    #f8f5ff 100%);
    
            color: #1e293b;
    
            position: relative;
            overflow-x: hidden;
        }
    
        /* ==================================
           BACKGROUND DECORATION
        ================================== */
    
        body::before,
        body::after {
            content: "";
    
            position: fixed;
    
            border-radius: 50%;
    
            filter: blur(90px);
    
            pointer-events: none;
    
            z-index: -1;
        }
    
        body::before {
            width: 400px;
            height: 400px;
    
            top: 100px;
            left: -180px;
    
            background: rgba(59, 130, 246, 0.10);
        }
    
        body::after {
            width: 450px;
            height: 450px;
    
            right: -200px;
            bottom: -180px;
    
            background: rgba(139, 92, 246, 0.10);
        }
    
        /* ==================================
           CONTACT HEADING
        ================================== */
    
        body>h1 {
            width: fit-content;
    
            margin: 65px auto 10px;
    
            font-size: 42px;
            font-weight: 750;
    
            letter-spacing: -1px;
    
            text-align: center;
    
            background: linear-gradient(135deg,
                    #1e3a8a,
                    #2563eb,
                    #7c3aed);
    
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
    
            position: relative;
    
            animation: headingEntry 0.6s ease;
        }
    
        body>h1::after {
            content: "";
    
            display: block;
    
            width: 55px;
            height: 4px;
    
            margin: 12px auto 0;
    
            border-radius: 20px;
    
            background: linear-gradient(90deg,
                    #3b82f6,
                    #8b5cf6);
        }
    
        @keyframes headingEntry {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
    
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    
        /* ==================================
           CONTACT FORM CARD
        ================================== */
    
        body>form {
            width: 90%;
            max-width: 580px;
    
            margin: 40px auto 80px;
    
            padding: 42px 45px;
    
            background: rgba(255, 255, 255, 0.82);
    
            border: 1px solid rgba(255, 255, 255, 0.95);
    
            border-radius: 26px;
    
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
    
            box-shadow:
                0 25px 60px rgba(30, 64, 175, 0.10),
                0 5px 15px rgba(15, 23, 42, 0.05);
    
            position: relative;
    
            animation: formEntry 0.7s ease;
        }
    
        @keyframes formEntry {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }
    
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    
        /* Gradient line on card */
    
        body>form::before {
            content: "";
    
            position: absolute;
    
            top: 0;
            left: 50%;
    
            transform: translateX(-50%);
    
            width: 85%;
            height: 4px;
    
            border-radius: 0 0 20px 20px;
    
            background: linear-gradient(90deg,
                    #2563eb,
                    #06b6d4,
                    #8b5cf6);
        }
    
        /* ==================================
           LABELS
        ================================== */
    
        body>form label {
            display: block;
    
            margin-bottom: 8px;
    
            color: #334155;
    
            font-size: 14px;
            font-weight: 600;
        }
    
        /* ==================================
           INPUT + TEXTAREA
        ================================== */
    
        body>form input[type="text"],
        body>form input[type="email"],
        body>form textarea {
            width: 100%;
    
            padding: 14px 16px;
    
            background: rgba(248, 250, 252, 0.95);
    
            border: 1px solid #dbe3ef;
    
            border-radius: 12px;
    
            color: #1e293b;
    
            font-size: 15px;
    
            outline: none;
    
            transition:
                border 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease;
        }
    
        body>form input[type="text"],
        body>form input[type="email"] {
            height: 52px;
        }
    
        /* ==================================
           HOVER
        ================================== */
    
        body>form input[type="text"]:hover,
        body>form input[type="email"]:hover,
        body>form textarea:hover {
            background: white;
    
            border-color: #93c5fd;
        }
    
        /* ==================================
           FOCUS
        ================================== */
    
        body>form input[type="text"]:focus,
        body>form input[type="email"]:focus,
        body>form textarea:focus {
            background: white;
    
            border-color: #3b82f6;
    
            box-shadow:
                0 0 0 4px rgba(59, 130, 246, 0.10),
                0 7px 18px rgba(59, 130, 246, 0.08);
    
            transform: translateY(-1px);
        }
    
        /* ==================================
           MESSAGE TEXTAREA
        ================================== */
    
        body>form textarea {
            min-height: 145px;
    
            resize: vertical;
    
            line-height: 1.6;
        }
    
        /* ==================================
           SUBMIT BUTTON
        ================================== */
    
        body>form input[type="submit"] {
            width: 100%;
            height: 54px;
    
            margin-top: 5px;
    
            border: none;
            border-radius: 13px;
    
            background: linear-gradient(135deg,
                    #2563eb,
                    #6366f1,
                    #8b5cf6);
    
            background-size: 200% 200%;
    
            color: white;
    
            font-size: 15px;
            font-weight: 700;
    
            letter-spacing: 0.3px;
    
            cursor: pointer;
    
            box-shadow:
                0 10px 25px rgba(99, 102, 241, 0.25);
    
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background-position 0.4s ease;
        }
    
        body>form input[type="submit"]:hover {
            transform: translateY(-3px);
    
            background-position: 100% 50%;
    
            box-shadow:
                0 16px 32px rgba(99, 102, 241, 0.35);
        }
    
        body>form input[type="submit"]:active {
            transform: translateY(0) scale(0.99);
        }
    
        /* ==================================
           RESPONSIVE
        ================================== */
    
        @media (max-width: 650px) {
    
            body>h1 {
                margin-top: 45px;
    
                font-size: 34px;
            }
    
            body>form {
                width: 92%;
    
                margin-top: 35px;
    
                padding: 35px 23px;
    
                border-radius: 21px;
            }
    
            body>form input[type="text"],
            body>form input[type="email"] {
                height: 49px;
            }
        }
    
        @media (max-width: 400px) {
    
            body>h1 {
                font-size: 30px;
            }
    
            body>form {
                padding: 30px 18px;
            }
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <h1>Contact Us</h1>
    <form method="post" action="/contact/">
        {% csrf_token %}

        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <br><br>

        <input type="submit" value="Send Message">
    </form>

</body>
</html>
