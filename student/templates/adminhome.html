<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    color: #0f172a;

    background:
        radial-gradient(circle at 10% 15%,
            rgba(59, 130, 246, 0.15),
            transparent 28%),

        radial-gradient(circle at 90% 80%,
            rgba(139, 92, 246, 0.13),
            transparent 30%),

        radial-gradient(circle at 80% 10%,
            rgba(6, 182, 212, 0.10),
            transparent 25%),

        linear-gradient(
            135deg,
            #f8fafc,
            #eef4ff,
            #f8fafc
        );

    position: relative;
    overflow-x: hidden;
}

/* ==================================
   BACKGROUND DECORATION
================================== */

body::before {
    content: "";

    position: fixed;

    width: 450px;
    height: 450px;

    background: rgba(37, 99, 235, 0.08);

    border-radius: 50%;

    filter: blur(80px);

    top: 150px;
    left: -250px;

    z-index: -1;
}

body::after {
    content: "";

    position: fixed;

    width: 450px;
    height: 450px;

    background: rgba(124, 58, 237, 0.08);

    border-radius: 50%;

    filter: blur(80px);

    right: -250px;
    bottom: -100px;

    z-index: -1;
}


/* ==================================
   DASHBOARD HEADER
================================== */

span {
    width: 100%;
    min-height: 115px;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 20% 50%,
            rgba(56, 189, 248, 0.15),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #0f172a,
            #172554,
            #1e1b4b
        );

    border-bottom: 1px solid rgba(255,255,255,0.10);

    box-shadow:
        0 10px 35px rgba(15, 23, 42, 0.22);
}

/* Glow inside header */

span::before {
    content: "";

    position: absolute;

    width: 250px;
    height: 250px;

    background: rgba(56, 189, 248, 0.13);

    border-radius: 50%;

    filter: blur(50px);

    left: 15%;
    top: -150px;
}

span::after {
    content: "";

    position: absolute;

    width: 250px;
    height: 250px;

    background: rgba(139, 92, 246, 0.18);

    border-radius: 50%;

    filter: blur(50px);

    right: 10%;
    bottom: -180px;
}


/* ==================================
   DASHBOARD TITLE
================================== */

span h1 {
    color: white;

    font-size: 34px;
    font-weight: 750;

    letter-spacing: -0.5px;

    position: relative;
    z-index: 2;

    text-shadow:
        0 4px 15px rgba(0,0,0,0.25);
}

/* Small underline */

span h1::after {
    content: "";

    display: block;

    width: 60px;
    height: 4px;

    margin: 12px auto 0;

    border-radius: 20px;

    background: linear-gradient(
        90deg,
        #38bdf8,
        #818cf8
    );

    box-shadow:
        0 0 15px rgba(56,189,248,0.5);
}


/* ==================================
   CARDS CONTAINER
================================== */

.container {
    width: 92%;
    max-width: 1250px;

    margin: 0 auto;

    padding: 65px 20px 80px;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(250px, 1fr));

    gap: 28px;
}


/* ==================================
   DASHBOARD CARD
================================== */

.container .card {
    min-height: 245px;

    margin: 0;
    padding: 32px 25px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    background: rgba(255,255,255,0.78);

    border: 1px solid rgba(255,255,255,0.95);

    border-radius: 22px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 15px 40px rgba(15,23,42,0.08);

    position: relative;

    overflow: hidden;

    transition:
        transform 0.35s ease,
        box-shadow 0.35s ease,
        border 0.35s ease;
}


/* ==================================
   CARD TOP GRADIENT
================================== */

.container .card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 5px;

    background: linear-gradient(
        90deg,
        #2563eb,
        #06b6d4
    );

    transform: scaleX(0);

    transform-origin: left;

    transition: transform 0.4s ease;
}

.container .card:hover::before {
    transform: scaleX(1);
}


/* ==================================
   CARD BACKGROUND GLOW
================================== */

.container .card::after {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background: rgba(37,99,235,0.07);

    right: -80px;
    bottom: -80px;

    transition: 0.4s ease;
}

.container .card:hover::after {
    width: 230px;
    height: 230px;

    background: rgba(37,99,235,0.09);
}


/* ==================================
   CARD HOVER
================================== */

.container .card:hover {
    transform: translateY(-10px);

    border-color: rgba(37,99,235,0.20);

    box-shadow:
        0 25px 55px rgba(37,99,235,0.14);
}


/* ==================================
   ICON
================================== */

.card img {
    width: 72px;
    height: 72px;

    object-fit: contain;

    padding: 13px;

    margin-bottom: 20px;

    border-radius: 18px;

    background: linear-gradient(
        135deg,
        #eff6ff,
        #dbeafe
    );

    border: 1px solid rgba(37,99,235,0.10);

    box-shadow:
        0 10px 25px rgba(37,99,235,0.12);

    position: relative;
    z-index: 2;

    transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;
}

.card:hover img {
    transform:
        translateY(-4px)
        scale(1.08);

    box-shadow:
        0 15px 30px rgba(37,99,235,0.18);
}


/* ==================================
   CARD HEADING
================================== */

.card h2 {
    color: #0f172a;

    font-size: 20px;
    font-weight: 700;

    margin-bottom: 20px;

    position: relative;
    z-index: 2;
}


/* ==================================
   GO BUTTON
================================== */

.card a {
    min-width: 110px;

    padding: 10px 22px;

    display: inline-flex;
    justify-content: center;
    align-items: center;

    text-decoration: none;

    color: white;

    font-size: 14px;
    font-weight: 600;

    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    );

    box-shadow:
        0 8px 20px rgba(37,99,235,0.22);

    position: relative;
    z-index: 3;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.card a:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 25px rgba(37,99,235,0.32);
}


/* ==================================
   DIFFERENT CARD COLORS
================================== */

/* Add Students */

.card:nth-child(1)::before {
    background:
        linear-gradient(90deg,#2563eb,#06b6d4);
}

.card:nth-child(1) img {
    background:
        linear-gradient(135deg,#dbeafe,#cffafe);
}


/* View Students */

.card:nth-child(2)::before {
    background:
        linear-gradient(90deg,#059669,#10b981);
}

.card:nth-child(2) img {
    background:
        linear-gradient(135deg,#d1fae5,#ecfdf5);
}

.card:nth-child(2) a {
    background:
        linear-gradient(135deg,#059669,#10b981);

    box-shadow:
        0 8px 20px rgba(5,150,105,0.22);
}


/* Search Records */

.card:nth-child(3)::before {
    background:
        linear-gradient(90deg,#7c3aed,#a855f7);
}

.card:nth-child(3) img {
    background:
        linear-gradient(135deg,#ede9fe,#f3e8ff);
}

.card:nth-child(3) a {
    background:
        linear-gradient(135deg,#7c3aed,#9333ea);

    box-shadow:
        0 8px 20px rgba(124,58,237,0.22);
}


/* Accounts */

.card:nth-child(4)::before {
    background:
        linear-gradient(90deg,#ea580c,#f59e0b);
}

.card:nth-child(4) img {
    background:
        linear-gradient(135deg,#ffedd5,#fef3c7);
}

.card:nth-child(4) a {
    background:
        linear-gradient(135deg,#ea580c,#f59e0b);

    box-shadow:
        0 8px 20px rgba(234,88,12,0.20);
}


/* Logout */

.card:nth-child(5)::before {
    background:
        linear-gradient(90deg,#dc2626,#f43f5e);
}

.card:nth-child(5) img {
    background:
        linear-gradient(135deg,#fee2e2,#ffe4e6);
}

.card:nth-child(5) a {
    background:
        linear-gradient(135deg,#dc2626,#e11d48);

    box-shadow:
        0 8px 20px rgba(220,38,38,0.20);
}


/* Feedback */

.card:nth-child(6)::before {
    background:
        linear-gradient(90deg,#0891b2,#2563eb);
}

.card:nth-child(6) img {
    background:
        linear-gradient(135deg,#cffafe,#dbeafe);
}

.card:nth-child(6) a {
    background:
        linear-gradient(135deg,#0891b2,#2563eb);

    box-shadow:
        0 8px 20px rgba(8,145,178,0.22);
}


/* ==================================
   ENTRY ANIMATION
================================== */

.card {
    animation: cardEntry 0.6s ease both;
}

.card:nth-child(1) {
    animation-delay: 0.05s;
}

.card:nth-child(2) {
    animation-delay: 0.10s;
}

.card:nth-child(3) {
    animation-delay: 0.15s;
}

.card:nth-child(4) {
    animation-delay: 0.20s;
}

.card:nth-child(5) {
    animation-delay: 0.25s;
}

.card:nth-child(6) {
    animation-delay: 0.30s;
}

@keyframes cardEntry {

    from {
        opacity: 0;

        transform:
            translateY(25px)
            scale(0.97);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* ==================================
   TABLET
================================== */

@media (max-width: 950px) {

    .container {
        grid-template-columns:
            repeat(2, minmax(240px, 1fr));
    }
}


/* ==================================
   MOBILE
================================== */

@media (max-width: 600px) {

    span {
        min-height: 95px;

        padding: 20px;
    }

    span h1 {
        font-size: 25px;

        text-align: center;
    }

    .container {
        width: 94%;

        grid-template-columns: 1fr;

        padding:
            40px 10px
            60px;

        gap: 20px;
    }

    .container .card {
        width: 100%;

        min-height: 220px;

        padding: 28px 20px;
    }
}




    </style>
</head>

            <a href="{% url 'search_student' %}">Go</a>
        </div>

</body>
</html>
