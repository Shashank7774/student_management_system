<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.20), transparent 32%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.18), transparent 35%),
                radial-gradient(circle at 80% 10%, rgba(59, 130, 246, 0.12), transparent 25%),
                linear-gradient(135deg, #f8fafc 0%, #eef2ff 45%, #f5f3ff 100%);
        }

        /* Background decorative glow */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(5px);
            pointer-events: none;
            animation: floatingGlow 8s ease-in-out infinite alternate;
        }

        body::before {
            width: 350px;
            height: 350px;
            top: -170px;
            left: -100px;
            background: rgba(99, 102, 241, 0.13);
        }

        body::after {
            width: 420px;
            height: 420px;
            right: -180px;
            bottom: -200px;
            background: rgba(168, 85, 247, 0.12);
            animation-delay: 1s;
        }

        @keyframes floatingGlow {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(30px, 25px) scale(1.08);
            }
        }

        form {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 5;
        }

        /* =========================
           MAIN GLASS CARD
        ========================== */

        .container {
            width: 100%;
            padding: 44px 38px 38px;

            background: rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;

            box-shadow:
                0 30px 70px rgba(15, 23, 42, 0.12),
                0 10px 30px rgba(99, 102, 241, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);

            position: relative;
            overflow: hidden;

            animation: cardEntry 0.7s ease;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Premium top gradient line */

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);

            width: 72%;
            height: 5px;

            background: linear-gradient(90deg,
                    transparent,
                    #6366f1,
                    #8b5cf6,
                    #a855f7,
                    transparent);

            border-radius: 0 0 15px 15px;
        }

        /* Inner decorative glow */

        .container::after {
            content: "";
            position: absolute;

            width: 180px;
            height: 180px;

            top: -110px;
            right: -80px;

            border-radius: 50%;

            background: rgba(139, 92, 246, 0.10);

            pointer-events: none;
        }

        /* =========================
           HEADING
        ========================== */

        .container h2 {
            text-align: center;

            font-size: 31px;
            font-weight: 800;

            letter-spacing: -0.8px;

            background: linear-gradient(135deg,
                    #111827,
                    #4338ca,
                    #7c3aed);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

            margin-bottom: 10px;
        }

        .subtitle {
            max-width: 330px;

            margin: 0 auto 32px;

            text-align: center;

            color: #64748b;

            font-size: 14px;
            line-height: 1.7;
        }

        /* =========================
           LABELS
        ========================== */

        label {
            display: block;

            color: #334155;

            font-size: 13.5px;
            font-weight: 650;

            margin-bottom: 8px;
            margin-left: 3px;
        }

        /* =========================
           INPUTS
        ========================== */

        input[type="password"] {
            width: 100%;
            height: 53px;

            padding: 0 17px;

            border: 1.5px solid #e2e8f0;

            border-radius: 14px;

            background: rgba(248, 250, 252, 0.85);

            color: #0f172a;

            font-size: 14.5px;

            outline: none;

            box-shadow:
                inset 0 1px 2px rgba(15, 23, 42, 0.03);

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease;
        }

        input[type="password"]::placeholder {
            color: #94a3b8;
        }

        input[type="password"]:hover {
            border-color: #c7d2fe;
            background: #ffffff;
        }

        input[type="password"]:focus {
            background: #ffffff;

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.11),
                0 8px 20px rgba(99, 102, 241, 0.08);

            transform: translateY(-1px);
        }

        /* =========================
           UPDATE BUTTON
        ========================== */

        button[type="submit"] {
            position: relative;

            width: 100%;
            height: 54px;

            margin-top: 3px;

            border: none;
            border-radius: 14px;

            background: linear-gradient(135deg,
                    #4f46e5 0%,
                    #6366f1 40%,
                    #7c3aed 100%);

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            letter-spacing: 0.3px;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                0 12px 25px rgba(79, 70, 229, 0.28);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        /* Button shine */

        button[type="submit"]::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.25),
                    transparent);

            transform: skewX(-20deg);

            transition: left 0.6s ease;
        }

        button[type="submit"]:hover::before {
            left: 130%;
        }

        button[type="submit"]:hover {
            transform: translateY(-3px);

            box-shadow:
                0 17px 32px rgba(79, 70, 229, 0.34);
        }

        button[type="submit"]:active {
            transform: translateY(0) scale(0.99);
        }

        /* =========================
           DJANGO MESSAGES
        ========================== */

        .error-message,
        .success-message {
            padding: 12px 15px;

            margin-bottom: 22px;

            border-radius: 12px;

            font-size: 13px;
            font-weight: 500;

            text-align: center;
        }

        .error-message {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #e11d48;
        }

        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
        }

        /* =========================
           BACK BUTTON
        ========================== */

        .back {
            position: fixed;

            right: 28px;
            bottom: 28px;

            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 13px 21px;

            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 13px;

            background: rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            color: #4338ca;

            font-size: 13.5px;
            font-weight: 700;

            text-decoration: none;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.10);

            transition: all 0.3s ease;
        }

        .back:hover {
            color: #ffffff;

            background: linear-gradient(135deg,
                    #4f46e5,
                    #7c3aed);

            border-color: transparent;

            transform: translateY(-3px);

            box-shadow:
                0 14px 30px rgba(79, 70, 229, 0.25);
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 600px) {

            body {
                padding: 18px;
                align-items: center;
            }

            .container {
                padding: 36px 24px 30px;
                border-radius: 23px;
            }

            .container h2 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 27px;
            }

            input[type="password"] {
                height: 50px;
            }

            button[type="submit"] {
                height: 51px;
            }

            .back {
                right: 15px;
                bottom: 15px;

                padding: 11px 16px;

                font-size: 12.5px;
            }
        }
    </style>
</head>

<body>

    <form method="POST" action="{% url 'update_password' %}" onsubmit="return check_password()">

        {% csrf_token %}

        <div class="container">

            <h2>Change Password</h2>

            <p class="subtitle">
                Create a strong password to keep your account secure.
            </p>

            <!-- Django Messages -->

            {% if messages %}
            {% for message in messages %}

            <div class="{% if message.tags == 'success' %}success-message{% else %}error-message{% endif %}">
                {{ message }}
            </div>

            {% endfor %}
            {% endif %}


            <label for="old_pass">Old Password</label>

            <input type="password" name="old_pass" id="old_pass" placeholder="Enter your old password" required>

            <br><br>


            <label for="new_pass">New Password</label>

            <input type="password" name="new_pass" id="new_pass" placeholder="Enter your new password" required>

            <br><br>


            <label for="confirm_pass">Confirm Password</label>

            <input type="password" name="confirm_pass" id="confirm_pass" placeholder="Confirm your new password"
                required>

            <br><br>


            <button type="submit">
                Update Password
            </button>

        </div>

    </form>

    <a href="{% url 'adminhome' %}" class="back">
        ← Back to Dashboard
    </a>


    <script>

        function check_password() {

            let new_pass =
                document.getElementById('new_pass').value;

            let confirm_pass =
                document.getElementById('confirm_pass').value;


            if (new_pass !== confirm_pass) {

                alert(
                    "New Password and Confirm Password don't match!"
                );

                return false;
            }


            if (new_pass.length < 6) {

                alert(
                    "Password must contain at least 6 characters!"
                );

                return false;
            }


            return true;
        }

    </script>

</body>

</html>
