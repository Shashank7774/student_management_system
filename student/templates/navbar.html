<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* =========================
   NAVBAR
========================= */

.navbar {
    width: 100%;
    background: rgba(15, 23, 42, 0.96);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.25),
        0 1px 0 rgba(56, 189, 248, 0.08);

    position: sticky;
    top: 0;
    z-index: 1000;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 92%;
    max-width: 1400px;
    min-height: 78px;

    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 10px 0;
}

/* =========================
   LOGO
========================= */

.logo {
    display: flex;
    align-items: center;
    gap: 12px;

    text-decoration: none;

    transition: 0.3s ease;
}

.logo img {
    width: 52px;
    height: 52px;

    object-fit: cover;
    border-radius: 14px;

    background: white;
    padding: 4px;

    border: 1px solid rgba(56, 189, 248, 0.4);

    box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.25),
        0 0 15px rgba(56, 189, 248, 0.15);

    transition: 0.35s ease;
}

.logo:hover img {
    transform: rotate(-5deg) scale(1.07);

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.3),
        0 0 25px rgba(56, 189, 248, 0.3);
}

.logo b {
    color: #ffffff;

    font-size: 22px;
    font-weight: 700;

    letter-spacing: 0.3px;

    white-space: nowrap;
}

/* Student Records gradient effect */

.logo b {
    background: linear-gradient(
        90deg,
        #ffffff,
        #bae6fd,
        #38bdf8
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* =========================
   NAV LINKS
========================= */

.navbar ul {
    list-style: none;

    display: flex;
    align-items: center;

    gap: 10px;
}

/* REMOVE OLD 150px MARGIN */

.navbar ul li {
    margin: 0;
    display: block;
}

/* =========================
   LINKS
========================= */

.navbar ul li a {
    color: #cbd5e1;

    text-decoration: none;

    font-size: 15px;
    font-weight: 500;

    display: flex;
    align-items: center;

    gap: 7px;

    padding: 11px 16px;

    border-radius: 10px;

    position: relative;

    transition: all 0.3s ease;
}

/* ICON */

.navbar ul li a i {
    font-size: 15px;
    margin: 0;

    color: #94a3b8;

    transition: 0.3s ease;
}

/* =========================
   HOVER EFFECT
========================= */

.navbar ul li a:hover {
    color: #ffffff;

    background: rgba(56, 189, 248, 0.10);

    transform: translateY(-2px);

    box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.15),
        inset 0 0 0 1px rgba(56, 189, 248, 0.15);
}

.navbar ul li a:hover i {
    color: #38bdf8;

    transform: scale(1.15);
}

/* =========================
   ANIMATED UNDERLINE
========================= */

.navbar ul li a::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 4px;

    width: 0;
    height: 2px;

    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #38bdf8,
        #818cf8
    );

    transform: translateX(-50%);

    transition: width 0.3s ease;
}

.navbar ul li a:hover::after {
    width: 45%;
}

/* =========================
   ADMIN BUTTON SPECIAL
========================= */

.navbar ul li:last-child a {
    color: white;

    background: linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    padding: 11px 19px;

    box-shadow:
        0 6px 18px rgba(37, 99, 235, 0.25);
}

.navbar ul li:last-child a i {
    color: white;
}

.navbar ul li:last-child a:hover {
    background: linear-gradient(
        135deg,
        #3b82f6,
        #8b5cf6
    );

    transform: translateY(-3px);

    box-shadow:
        0 10px 25px rgba(99, 102, 241, 0.35);
}

.navbar ul li:last-child a::after {
    display: none;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 950px) {

    .container {
        width: 94%;
    }

    .navbar ul {
        gap: 3px;
    }

    .navbar ul li a {
        padding: 10px 9px;
        font-size: 14px;
    }

    .logo b {
        font-size: 19px;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 750px) {

    .container {
        flex-direction: column;
        gap: 12px;

        padding: 12px 0;
    }

    .navbar ul {
        width: 100%;

        justify-content: center;

        flex-wrap: wrap;

        gap: 5px;
    }

    .navbar ul li a {
        font-size: 13px;

        padding: 9px 11px;
    }

    .logo img {
        width: 45px;
        height: 45px;
    }

    .logo b {
        font-size: 19px;
    }
}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 480px) {

    .navbar ul li a {
        padding: 8px 9px;
    }

    .navbar ul li a i {
        font-size: 14px;
    }

    .navbar ul {
        gap: 2px;
    }
}
    </style>



</head>

<body>
    <div class="navbar">
        <div class="container">
            <a href="" class="logo">
                <img
                    src="https://www.kindpng.com/picc/m/227-2271076_student-management-system-symbol-hd-png-download.png">

                <b>Student Records</b>
            </a>
            <ul>
                <li><a href="{% url 'index' %}"> <i class="fa-solid fa-house"></i>Home</a></li>
                <li><a href="{% url 'login' %}"><i class="fa-solid fa-right-to-bracket"></i>Login</a></li>
                <li><a href="{% url 'about' %}"><i class="fa-solid fa-address-card"></i>About</a></li>
                <li><a href="{% url 'contact' %}"><i class="fa-solid fa-circle-info"></i>Contact</a></li>
                <li><a href="{% url 'adminhome' %}"><i class="fa-brands fa-black-tie"></i>Admin</a></li>
            </ul>
        </div>
    </div>

</body>

</html>
